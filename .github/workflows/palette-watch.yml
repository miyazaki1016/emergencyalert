name: JMA Palette Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  observe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Observe JMA palette evidence
        run: npm run palette:watch
