name: Vercel quota monitor unit tests
on:
  pull_request:
    paths:
      - 'scripts/vercel_quota_monitor.py'
      - 'tests/test_vercel_quota_monitor.py'
      - '.github/workflows/vercel-quota-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests (no Vercel credentials)
        run: python -m unittest discover -s tests -p 'test_vercel_quota_monitor.py' -v
