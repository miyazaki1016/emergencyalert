name: Vercel quota monitor unit tests
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'scripts/vercel_quota_monitor.py'
      - 'scripts/vercel_release_request_policy.py'
      - 'scripts/vercel_release_request_simulation.py'
      - 'tests/test_vercel_quota_monitor.py'
      - 'tests/test_vercel_release_request_policy.py'
      - 'tests/test_vercel_release_request_simulation.py'
      - '.github/workflows/vercel-quota-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run quota-monitor and release-request offline tests
        run: |
          python -m unittest discover -s tests -p 'test_vercel_quota_monitor.py' -v
          python -m unittest discover -s tests -p 'test_vercel_release_request_policy.py' -v
          python -m unittest discover -s tests -p 'test_vercel_release_request_simulation.py' -v
