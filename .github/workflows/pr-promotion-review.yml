name: PR promotion classification (review only)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
permissions:
  contents: read
  pull-requests: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test policy from trusted main
        run: python3 -m unittest discover -s tests -p 'test_pr_promotion_policy.py' -v
      - name: Classify changed files (no approval or merge)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr_promotion_review.py
      - name: Upload review result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-promotion-review
          path: inventory-output/pr-promotion-review.json
          if-no-files-found: warn
          retention-days: 7
