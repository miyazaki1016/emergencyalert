name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: emergencyalert_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d emergencyalert_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsx scripts/national-rain-budget-proof.ts
      - name: Benchmark fixed N03 intersection
        run: npx tsx scripts/n03-administrative-area-benchmark.ts
      - name: Measure live N03 detail phases
        run: |
          curl --fail --location --retry 3 "https://nlftp.mlit.go.jp/ksj/gml/data/N03/N03-2026/N03-20260101_13_GML.zip" -o /tmp/n03-tokyo.zip
          rm -rf /tmp/n03-tokyo
          mkdir -p /tmp/n03-tokyo
          unzip -q /tmp/n03-tokyo.zip -d /tmp/n03-tokyo
          npx tsx scripts/n03-tokyo-live-rain-proof.ts /tmp/n03-tokyo/N03-20260101_13.geojson > /tmp/n03-live.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/n03-live.json","utf8"));process.stdout.write(JSON.stringify(x.selectedDetailInput));' > /tmp/n03-selected-input.json
          N03_CACHE_DIR=/tmp/n03-cache npx tsx scripts/n03-selected-prefectures-proof.ts < /tmp/n03-selected-input.json | tee /tmp/n03-first.json
          N03_CACHE_DIR=/tmp/n03-cache npx tsx scripts/n03-selected-prefectures-proof.ts < /tmp/n03-selected-input.json | tee /tmp/n03-cached.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("/tmp/n03-first.json","utf8"));const b=JSON.parse(fs.readFileSync("/tmp/n03-cached.json","utf8"));if(b.cacheHits!==b.loadedPrefectures.length)throw new Error("expected all N03 prefectures from cache");if(b.preparedCacheHits!==b.loadedPrefectures.length)throw new Error("expected all prepared N03 areas from cache");if(JSON.stringify(a.affectedAreas)!==JSON.stringify(b.affectedAreas))throw new Error("cached N03 result mismatch");'
          node -e 'const fs=require("fs"),path=require("path");const root="/tmp/n03-cache";const rows=fs.readdirSync(root).filter(n=>n.endsWith(".areas.json")).sort().map(name=>({prefectureCode:name.slice(0,2),bytes:fs.statSync(path.join(root,name)).size}));const totalBytes=rows.reduce((sum,row)=>sum+row.bytes,0);console.log(JSON.stringify({preparedN03Sizes:rows,totalBytes,totalMiB:Math.round(totalBytes/1048576*100)/100}));'
      - name: Verify reproducible N03 prepared-data generator
        run: |
          rm -rf /tmp/n03-prepared-check
          npx tsx scripts/prepare-n03-storage-data.ts /tmp/n03-prepared-check 13
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("/tmp/n03-prepared-check/manifest.json","utf8"));if(m.dataset!=="N03-20260101")throw new Error("unexpected dataset");if(m.files.length!==1||m.files[0].code!=="13")throw new Error("unexpected prepared prefecture");if(!fs.existsSync("/tmp/n03-prepared-check/13.areas.json"))throw new Error("prepared Tokyo file missing");if(m.files[0].bytes<=0||m.files[0].areas<=0)throw new Error("prepared Tokyo file empty");'
      - name: Prove national rain queue lifecycle
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d emergencyalert_test -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
          psql -h 127.0.0.1 -U postgres -d emergencyalert_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260929_create_national_rain_refinement_jobs.sql
          psql -h 127.0.0.1 -U postgres -d emergencyalert_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.national_rain_refinement_jobs
            (run_key, basetime, validtime, zoom, tile_x, tile_y, priority)
          values
            ('ci-run', '2026-09-29T10:00:00Z', '2026-09-29T10:05:00Z', 8, 221, 100, 2),
            ('ci-run', '2026-09-29T10:00:00Z', '2026-09-29T10:10:00Z', 8, 222, 100, 1);

          do $queue$
          declare
            claimed_count integer;
            first_id bigint;
            remaining_count integer;
          begin
            select count(*), min(id) into claimed_count, first_id
            from public.claim_national_rain_refinement_jobs(1);
            if claimed_count <> 1 then raise exception 'expected one claimed job, got %', claimed_count; end if;

            perform public.finish_national_rain_refinement_job(first_id, true, null);

            select count(*) into remaining_count
            from public.claim_national_rain_refinement_jobs(20);
            if remaining_count <> 1 then raise exception 'expected one remaining job, got %', remaining_count; end if;

            select count(*) into remaining_count
            from public.claim_national_rain_refinement_jobs(20);
            if remaining_count <> 0 then raise exception 'expected no re-claim of processing/done jobs, got %', remaining_count; end if;
          end $queue$;

          insert into public.national_rain_refinement_jobs
            (run_key, basetime, validtime, zoom, tile_x, tile_y, status, attempts, claimed_at)
          values
            ('ci-stale', '2026-09-29T10:00:00Z', '2026-09-29T10:15:00Z', 8, 223, 100, 'PROCESSING', 1, now() - interval '6 minutes'),
            ('ci-fail', '2026-09-29T10:00:00Z', '2026-09-29T10:20:00Z', 8, 224, 100, 'PROCESSING', 5, now());

          do $queue$
          declare
            stale_id bigint;
            stale_attempts integer;
            failed_id bigint;
            failed_status text;
            reclaimed_count integer;
          begin
            select id into stale_id from public.national_rain_refinement_jobs where run_key = 'ci-stale';
            select count(*) into reclaimed_count
            from public.claim_national_rain_refinement_jobs(20)
            where id = stale_id;
            if reclaimed_count <> 1 then raise exception 'expected stale processing job to be reclaimed'; end if;

            select attempts into stale_attempts from public.national_rain_refinement_jobs where id = stale_id;
            if stale_attempts <> 2 then raise exception 'expected stale job attempts=2, got %', stale_attempts; end if;

            select id into failed_id from public.national_rain_refinement_jobs where run_key = 'ci-fail';
            perform public.finish_national_rain_refinement_job(failed_id, false, 'synthetic failure');
            select status into failed_status from public.national_rain_refinement_jobs where id = failed_id;
            if failed_status <> 'FAILED' then raise exception 'expected FAILED after max attempts, got %', failed_status; end if;

            select count(*) into reclaimed_count
            from public.claim_national_rain_refinement_jobs(100)
            where id = failed_id;
            if reclaimed_count <> 0 then raise exception 'FAILED job must not be reclaimed'; end if;
          end $queue$;
          SQL
      - run: npm run build
